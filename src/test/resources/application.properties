# 吃.env的資料
spring.config.import=optional:file:.env[.properties]

# 設定db連線
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:${TEST_DB_PORT}/${TEST_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# 啟用 Flyway , Spring Boot 啟動時會自動跑 migration
spring.flyway.enabled=true
# 指定 migration SQL 放在哪裡, migration 正式測試都是吃一樣檔案, 但是測試資料會另外放在test/resources/db/testdata
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
spring.flyway.baseline-on-migrate=true

# Hibernate 驗證
spring.jpa.hibernate.ddl-auto=validate
# 把 Hibernate 執行的 SQL 印到 console
spring.jpa.show-sql=true
# 把印出來的 SQL 排版，變得比較好讀
spring.jpa.properties.hibernate.format_sql=true

# Gmail 設定
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT 設定
jwt.secret=${JWT_SECRET}
jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS}
jwt.refresh-token-seconds=${JWT_REFRESH_TOKEN_SECONDS}

# Password reset
# Test resources override the main application.properties, so these values must
# also be declared here for MemberService to be created during context startup.
app.base-url=${APP_BASE_URL:http://localhost:8080}
member.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
