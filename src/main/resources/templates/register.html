<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊</title>
    <style>
        body { margin: 0; min-height: 100vh; font-family: Arial, "Noto Sans TC", sans-serif; background: #f4f6f8; display: grid; place-items: center; color: #1f2933; }
        main { width: min(420px, calc(100vw - 32px)); margin: 24px 0; padding: 32px; box-sizing: border-box; background: #fff; border: 1px solid #d9e2ec; border-radius: 8px; }
        h1 { margin: 0 0 24px; font-size: 28px; }
        label { display: block; margin: 16px 0 8px; font-weight: 700; }
        input, select { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #bcccdc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; margin-top: 24px; padding: 12px 16px; border: 0; border-radius: 6px; background: #1769aa; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .message { display: none; margin: 0 0 16px; padding: 12px; border-radius: 6px; }
        .error { background: #ffe3e3; color: #9b1c1c; }
        .success { background: #d3f9d8; color: #246b35; }
        .links { margin-top: 16px; text-align: center; font-size: 14px; }
        .links a { color: #1769aa; }
    </style>
</head>
<body>
<main>
    <h1>會員註冊</h1>
    <p id="error" class="message error"></p>
    <p id="success" class="message success"></p>
    <form id="registerForm">
        <label for="name">姓名</label>
        <input id="name" type="text" maxlength="30" required>
        <label for="account">帳號</label>
        <input id="account" type="text" maxlength="30" required>
        <label for="email">電子郵件</label>
        <input id="email" type="email" maxlength="128" required>
        <label for="gender">性別</label>
        <select id="gender" required>
            <option value="">請選擇</option>
            <option value="0">未提供</option>
            <option value="1">男性</option>
            <option value="2">女性</option>
        </select>
        <label for="password">密碼（6 至 12 個字元）</label>
        <input id="password" type="password" minlength="6" maxlength="12" required>
        <label for="confirmPassword">確認密碼</label>
        <input id="confirmPassword" type="password" minlength="6" maxlength="12" required>
        <button id="registerButton" type="submit">註冊</button>
    </form>
    <div class="links"><a href="/page/login">已有帳號？回登入頁</a></div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $("#registerForm").on("submit", function (event) {
        event.preventDefault();
        $("#error, #success").hide();
        $("#registerButton").prop("disabled", true).text("註冊中");
        const payload = {
            name: $("#name").val().trim(),
            account: $("#account").val().trim(),
            email: $("#email").val().trim(),
            gender: Number($("#gender").val()),
            password: $("#password").val(),
            confirmPassword: $("#confirmPassword").val()
        };
        $.ajax({
            url: "/members/register",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),
            success: function (data) {
                $("#success").text(data.message || "會員註冊成功，正在前往登入頁").show();
                window.setTimeout(function () { window.location.href = "/page/login"; }, 1000);
            },
            error: function (xhr) {
                const data = xhr.responseJSON || {};
                const errors = data.errors || {};
                $("#error").text(Object.values(errors)[0] || data.message || "註冊失敗").show();
            },
            complete: function () { $("#registerButton").prop("disabled", false).text("註冊"); }
        });
    });
</script>
</body>
</html>
