spring.application.name=gtalent_spring_boot_260801
spring.config.import=optional:file:.env[.properties],optional:file:gtalent_spring_boot_260801/.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gtalent_spring_boot_260801}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

jwt.secret=${JWT_SECRET}
jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS}
jwt.refresh-token-seconds=${JWT_REFRESH_TOKEN_SECONDS}

app.base-url=${APP_BASE_URL}
member.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES}

newebpay.merchant-id=${NEWEBPAY_MERCHANT_ID:}
newebpay.hash-key=${NEWEBPAY_HASH_KEY:}
newebpay.hash-iv=${NEWEBPAY_HASH_IV:}
newebpay.version=${NEWEBPAY_VERSION:}
newebpay.gateway-url=${NEWEBPAY_GATEWAY_URL:}
newebpay.notify-url=${NEWEBPAY_NOTIFY_URL:}
newebpay.return-url=${NEWEBPAY_RETURN_URL:}

line.bot.channel-token=${LINE_CHANNEL_ACCESS_TOKEN}
line.bot.channel-secret=${LINE_CHANNEL_SECRET}
line.bot.handler.path=/api/line/webhook
line.liff.id=${LIFF_ID:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
